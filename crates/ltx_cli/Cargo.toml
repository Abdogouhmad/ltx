[dependencies]
clap = { workspace = true }
ltx_compiler = { workspace = true }
ltx_config = { workspace = true }
ltx_diagnostics = { workspace = true }
ltx_lexer = { workspace = true }
ltx_parser = { workspace = true }
ltx_utils = { workspace = true }
ltx_linter = { workspace = true }
miette = { workspace = true }
notify = { workspace = true }
owo-colors = { workspace = true }
self_update = { version = "0.44", optional = true, default-features = false, features = [
    "ureq",
    "rustls",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
] }
thiserror = { workspace = true }
[dev-dependencies]
predicates = "3.1.4"
pretty_assertions = { workspace = true }
tempfile = "3"
