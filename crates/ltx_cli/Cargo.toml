[package]
name = "ltx_cli"
edition.workspace = true
version.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[package.metadata.wix]
upgrade-guid = "67DF9ECB-A6E6-4419-AE0F-1D04414B3F41"
path-guid = "FFB2AF84-01A9-4919-AE9C-6BF55AFF57E7"
license = false
eula = false

[[bin]]
name = "ltx"
path = "src/main.rs"

[features]
default = ["self-update"]
