# Injected into cargo-dist's build-local-artifacts job (see `github-build-setup`
# in dist-workspace.toml) to install Tectonic's native build dependencies.
- name: Install native build deps (Linux)
  if: runner.os == 'Linux'
  shell: bash
  run: |
    sudo apt-get update
    sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
      libgraphite2-dev \
      libfontconfig1-dev \
      libicu-dev \
      libpng-dev \
      libssl-dev \
      openssl \
      zlib1g-dev \
      pkg-config
    # Statically link ICU/graphite2/fontconfig/png instead of dynamically
    # linking whatever ICU major version this runner happens to have
    # (e.g. libicuuc.so.70 on ubuntu-22.04). Without this, the released
    # binary breaks on any distro with a different ICU version — Arch,
    # Fedora, etc. always ship a newer major than Ubuntu 22.04's ICU 70.
    echo "TECTONIC_PKGCONFIG_FORCE_SEMI_STATIC=1" >> "$GITHUB_ENV"
- name: Install native build deps (macOS)
  if: runner.os == 'macOS'
  shell: bash
  run: |
    brew install freetype graphite2 icu4c libpng openssl
    icupcdir="$(echo "$(brew --cellar icu4c)"/"$(ls "$(brew --cellar icu4c)" | sort -V | tail -1)"/lib/pkgconfig)"
    echo "PKG_CONFIG_PATH=$icupcdir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
    # Same reasoning as Linux: statically link ICU/graphite2/fontconfig/png
    # instead of dynamically linking the runner's brew-installed versions,
    # which drift across macOS runner images and homebrew formula bumps.
    echo "TECTONIC_PKGCONFIG_FORCE_SEMI_STATIC=1" >> "$GITHUB_ENV"
- name: Compute vcpkg cache key (Windows)
  if: runner.os == 'Windows'
  shell: bash
  run: |
    VCPKG="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}/vcpkg.exe"
    COMMIT="$("$VCPKG" version | sed -n 's/^commit //p' | tr -d '\r')"
    echo "VCPKG_COMMIT=${COMMIT:-unknown}" >> "$GITHUB_ENV"
    echo "VCPKG_CACHE_DIR=$LOCALAPPDATA/vcpkg/archives" >> "$GITHUB_ENV"
- name: Cache vcpkg binary cache (Windows)
  if: runner.os == 'Windows'
  uses: actions/cache@v4
  with:
    path: "${{ env.VCPKG_CACHE_DIR }}"
    key: "${{ runner.os }}-vcpkg-${{ env.VCPKG_COMMIT }}"
    restore-keys: |
      ${{ runner.os }}-vcpkg-
- name: Install native build deps (Windows)
  if: runner.os == 'Windows'
  shell: bash
  run: |
    VCPKG="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}/vcpkg.exe"
    "$VCPKG" install --triplet x64-windows-static fontconfig freetype "harfbuzz[graphite2]" icu
    echo "TECTONIC_DEP_BACKEND=vcpkg" >> "$GITHUB_ENV"
    echo "VCPKGRS_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"
    echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}" >> "$GITHUB_ENV"
