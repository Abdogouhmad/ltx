[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.6"
repository = "https://github.com/Abdogouhmad/ltx"
homepage = "https://github.com/Abdogouhmad/ltx"
authors = ["Abderrahman Gouhmad <gouhmada@gmail.com>"]
license = "MIT"
readme = "README.md"
description = "A fast, opinionated LaTeX toolchain — lint, format, compile."
keywords = ["latex", "cli", "linter", "formatter", "toolchain"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# --- internal crates ---------------------------------------------------
ltx_lexer = { path = "crates/ltx_lexer" }
ltx_parser = { path = "crates/ltx_parser" }
ltx_diagnostics = { path = "crates/ltx_diagnostics" }
ltx_config = { path = "crates/ltx_config" }
ltx_utils = { path = "crates/ltx_utils" }

# --- parsing / CLI -------------------------------------------------------
regex = "1.12.4" # regex-based parsing
clap = { version = "4.6.1", features = [
  "derive",
  "env",
  "wrap_help",
] } # CLI parsing

# --- error reporting / handling ------------------------------------------
miette = { version = "7.6.0", features = ["fancy", "derive"] }
thiserror = "2.0.18"                                           # 2.x drops the need for #[error(transparent)] boilerplate

# --- serialisation / config -----------------------------------------------
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1.3" }
dirs = { version = "6.0.0" }

# --- CLI output ------------------------------------------------------------
owo-colors = { version = "4.3.0" }

# --- filesystem / watch -----------------------------------------------------
notify = "8.2.0"    # inotify-backed file watcher for `ltx run`
tempfile = "3.27.0"

# compiler packages
tectonic = { version = "0.17", default-features = false, features = [
  "geturl-curl",
  "serialization",
] }
tectonic_bundles = { version = "0.4", default-features = false, features = [
  "geturl-curl",
] }

# --- dev / test ---------------------------------------------------------------
insta = { version = "1", features = ["filters"] }            # snapshot tests
pretty_assertions = "1.4.1"
criterion = { version = "0.8", features = ["html_reports"] }

# ============================================================================
# Build profiles
# ============================================================================

# Fast iterative dev builds (default for `cargo build` / `cargo run`)
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Slightly faster dev binaries — useful when runtime matters but binary size
# doesn't. Run with: `cargo build --profile dev-opt`
[profile.dev-opt]
inherits = "dev"
opt-level = 1

# Production-grade release: small, fast binary — used for `cargo install`
# and published GitHub releases.
[profile.release]
opt-level = 3
lto = "thin"        # "fat" gives ~5% more speed, 2x slower link time
codegen-units = 1   # single CGU = more inlining across crate boundaries
strip = "symbols"   # shaves ~30% off binary size, no runtime cost
panic = "abort"     # no unwinding machinery in release builds
debug = false
incremental = false

# Same as release but keeps debuginfo — useful for profiling with perf/samply
[profile.profiling]
inherits = "release"
debug = 1            # line tables only
strip = "none"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# ============================================================================
# Workspace-wide lints (propagated to every member crate)
# ============================================================================

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
missing_docs = "warn"
# allow cfg flags used by fuzzing / benchmarking harnesses
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(fuzzing)",
  "cfg(codspeed)",
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# -- allow list: pedantic rules that produce more noise than signal here -----
module_name_repetitions = "allow" # `ltx_parser::parser::Parser` is fine
missing_errors_doc = "allow"      # enforced only on public API crates
missing_panics_doc = "allow"

# -- deny/upgrade list: specific lints promoted to errors --------------------
dbg_macro = "deny"
todo = "warn"             # keep as warn so scaffolding compiles
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"     # use owo-colors + eprintln! in CLI layer only
wildcard_imports = "deny"
